<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Search - Online Course Registration</title>

<link rel="stylesheet" href="style.css">
    
    <script src="auth.js"></script>
    <script>requireLogin();</script>
</head>

<body>

<header>
    <h1>Online Course Registration System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="student-login.html">Student Login</a>
        <a href="course-search.html" class="active">Course Search</a>
        <a href="student-registration.html">Student Registration</a>
        <a href="instructor-schedule.html">Instructor Schedule</a>
        <a href="session-enrollment.html">Session Enrollment</a>
    </nav>
</header>

<main>
    <h2 class="page-title">Course Search</h2>

    <p class="description">
        Search for available courses by department, instructor, or course number.
    </p>

    <section class="search-box">
        <div class="search-grid">
            <div class="form-group">
                <label for="department">Department</label>
                <select id="department">
                    <option value="">All Departments</option>
                    <option value="Information Systems">Information Systems</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Business">Business</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="English">English</option>
                </select>
            </div>

            <div class="form-group">
                <label for="instructor">Instructor</label>
                <input
                    type="text"
                    id="instructor"
                    placeholder="Enter instructor name">
            </div>

            <div class="form-group">
                <label for="course-number">Course Number</label>
                <input
                    type="text"
                    id="course-number"
                    placeholder="Example: 301">
            </div>
        </div>

        <div class="button-row">
            <button
                type="button"
                class="search-button"
                onclick="searchCourses()">
                Search Courses
            </button>

            <button
                type="button"
                class="clear-button"
                onclick="clearSearch()">
                Clear
            </button>
        </div>
    </section>

    <h2 class="results-header">Course Results</h2>

    <p class="result-count" id="result-count">
        Loading courses...
    </p>

    <section id="course-results"></section>
</main>

<footer>
    <p>Online Course Registration System</p>
</footer>

<!-- Load the shared course data before the page script. -->
<script src="course-data.js"></script>

<script>
    // Use the shared course list defined in course-data.js.
    const courses = Array.isArray(testCourses) ? testCourses : [];

    console.log("Courses loaded:", courses);

    function displayCourses(courseList) {
        const results = document.getElementById("course-results");
        const resultCount = document.getElementById("result-count");

        results.innerHTML = "";

        if (!Array.isArray(courseList) || courseList.length === 0) {
            resultCount.textContent = "0 courses found.";

            results.innerHTML = `
                <div class="no-results">
                    <h3>No Courses Found</h3>
                    <p>
                        No courses match your search criteria.
                        Try changing your search options.
                    </p>
                </div>
            `;
            return;
        }

        resultCount.textContent =
            courseList.length + " course(s) found.";

        courseList.forEach(function(course) {
            // Not every course necessarily has a scheduled session.
            const courseSessions = Array.isArray(course.sessions)
                ? course.sessions
                : [];

            const enrollmentValues = courseSessions
                .map(function(session) {
                    return Number(
                        session.maximumEnrollment ??
                        session.maxEnrollment
                    );
                })
                .filter(function(value) {
                    return Number.isFinite(value);
                });

            const maximumEnrollment = courseSessions.length > 0
                ? courseSessions.map(function(session) {
                return session.maximumEnrollment;
            }).join(", ")
            : course.maximumEnrollment;
            
           // const maximumEnrollment =
                //enrollmentValues.length > 0
                    //? enrollmentValues.join(", ")
                  //  : "Not yet scheduled";

            const courseCode = course.code || "";
            const courseNumber = course.number || "";
            const courseName = course.name || "Unnamed Course";

            const heading = courseCode && courseNumber &&
                !courseCode.endsWith(courseNumber)
                ? courseCode + " " + courseNumber
                : (courseCode || courseNumber);

            const card = document.createElement("div");
            card.className = "course-card";

            card.innerHTML = `
                <h3></h3>

                <p class="course-description"></p>

                <div class="course-info">
                    <p><strong>Department:</strong> ${course.department || "Not specified"}</p>
                    <p><strong>Instructor:</strong> ${course.instructor || "Not assigned"}</p>
                    <p><strong>Credit Hours:</strong> ${course.credits ?? "Not specified"}</p>
                    <p><strong>Prerequisites:</strong> ${course.prerequisites || "None listed"}</p>
                    <p><strong>Modality:</strong> ${course.modality || "Not specified"}</p>
                    <p><strong>Maximum Enrollment:</strong> ${maximumEnrollment}</p>
                </div>

                <a href="course-details.html?course=${encodeURIComponent(courseCode)}" class="register-link">
                    Register for Session
                </a>
            `;

            // Use textContent for course names to avoid interpreting them as HTML.
            card.querySelector("h3").textContent =
                (heading ? heading + " - " : "") + courseName;

            card.querySelector(".course-description").textContent =
                "This course is offered through the " +
                (course.department || "unspecified") +
                " department.";

            results.appendChild(card);
        });
    }

    function searchCourses() {
        const department =
            document.getElementById("department").value;

        const instructor =
            document.getElementById("instructor").value
                .toLowerCase()
                .trim();

        const courseNumber =
            document.getElementById("course-number").value
                .toLowerCase()
                .trim();

        const filteredCourses = courses.filter(function(course) {
            const departmentMatch =
                department === "" ||
                course.department === department;

            const instructorMatch =
                instructor === "" ||
                String(course.instructor || "")
                    .toLowerCase()
                    .includes(instructor);

            const numberMatch =
                courseNumber === "" ||
                String(course.number || "")
                    .toLowerCase()
                    .includes(courseNumber) ||
                String(course.code || "")
                    .toLowerCase()
                    .includes(courseNumber);

            return departmentMatch &&
                instructorMatch &&
                numberMatch;
        });

        displayCourses(filteredCourses);
    }

    function clearSearch() {
        document.getElementById("department").value = "";
        document.getElementById("instructor").value = "";
        document.getElementById("course-number").value = "";

        displayCourses(courses);
    }

    // Show every course when the page first opens.
    displayCourses(courses);
</script>

</body>
</html>
