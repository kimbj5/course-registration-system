<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Student Registration */
        .registration-section {
            background-color: white;
            padding: 30px;
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .registration-section h3 {
            color: #1f3c5b;
            margin-top: 0;
        }

        .session-card {
            border: 1px solid #dddddd;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .session-card h4 {
            color: #1f3c5b;
            margin-top: 0;
        }

        .session-card p {
            margin: 8px 0;
        }
        .session-card.selected {
            border: 2px solid #1f3c5b;
            background-color: #eef3f9;
        }

        .selected-banner {
            background-color: #eef3f9;
            border-left: 5px solid #1f3c5b;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        
        .register-button {
            margin-top: 10px;
            padding: 10px 18px;
            background-color: #1f3c5b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .register-button:hover {
            background-color: #315b89;
        }

        .register-button:disabled {
            background-color: #888888;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .enrolled {
            color: #555555;
            font-weight: bold;
        }

        .empty-message {
            margin-top: 15px;
            color: #555555;
        }
    </style>
    <script src="auth.js"></script>
    <script>requireLogin();</script>
</head>

<body>

    <header>
        <h1>Course Registration System</h1>

        
<nav>
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
    <a href="course-search.html">Course Search</a>
    <a href="course-details.html">Course Details</a>
    <a href="student-registration.html">Student Registration</a>
    <a href="instructor-schedule.html">Instructor Schedule</a>
    <a href="session-enrollment.html">Session Enrollment</a>
</nav>
    </header>

    <main>

        <h2>Student Registration</h2>

        <p>
            View your enrolled sessions and register for available courses.
        </p>

        <!-- WHO IS LOGGED IN -->

        <p id="login-status"></p>
        
        <!-- COURSE CHOSEN ON THE SEARCH PAGE -->

        <div id="selected-course"></div>
        
        <!-- CURRENTLY ENROLLED -->

        <div class="registration-section">

            <h3>Currently Enrolled Sessions</h3>

            <div id="enrolled-sessions"></div>

        </div>

        <!-- AVAILABLE SESSIONS -->

        <div class="registration-section">

            <h3>Available Sessions</h3>

            <div id="available-sessions"></div>

        </div>

        <!-- REGISTRATION MESSAGE -->

        <div id="registration-message" class="message"></div>

    </main>

    <!-- Load shared course and session data first -->
    <script src="course-data.js"></script>

    <script>
        // Test student accounts for the registration prototype
       // const studentAccounts = [
        //    {
     //           studentId: "ID",
     //           password: "password"
     //       },
     //       {
     //           studentId: "1001001",
    //            password: "TestPass123"
    //        },
    //        {
    //            studentId: "1001002",
    //            password: "TestPass456"
   //         },
   //         {
   //             studentId: "1001003",
  //              password: "TestPass789"
  //          }
  //      ];

        // Track sessions enrolled in by the current student
        const enrolledSessionIds = new Set();
        // Course picked on the search page, e.g. student-registration.html?course=INFO%20320
        const selectedCode =
            new URLSearchParams(window.location.search).get("course");
        // Keep track of session enrollment counts during this page visit
        const sessionEnrollment = {};

        // Find a session by its ID
        function findSession(sessionId) {
            for (const course of testCourses) {
                if (!Array.isArray(course.sessions)) {
                    continue;
                }

                const session = course.sessions.find(
                    item => String(item.id) === String(sessionId)
                );

                if (session) {
                    return {
                        course: course,
                        session: session
                    };
                }
            }

            return null;
        }

        // Initialize enrollment counts and any pre-enrolled sessions
        function initializeSessions() {
            testCourses.forEach(function(course) {
                if (!Array.isArray(course.sessions)) {
                    console.warn(
                        "Course has no sessions array:",
                        course.code,
                        course.number,
                        course.name
                    );
                    return;
                }

                course.sessions.forEach(function(session) {
                    const sessionId = String(session.id);

                    sessionEnrollment[sessionId] =
                        Number(session.currentEnrollment ?? 0);

                    if (session.initiallyEnrolled === true) {
                        enrolledSessionIds.add(sessionId);
                    }
                });
            });
        }

        // Build a session card from the shared course data
        function createSessionCard(course, session, isEnrolled) {
            const sessionId = String(session.id);
            const current = sessionEnrollment[sessionId];
            const maximum = Number(session.maximumEnrollment);

            const card = document.createElement("div");
            card.className = "session-card";

        // Highlight the sessions of the course chosen on the search page
            if (selectedCode && course.code === selectedCode) {
                card.classList.add("selected");
            }
            
            const heading = document.createElement("h4");
            heading.textContent =
                `${course.code} - Section ${session.section}`;
            card.appendChild(heading);

            const details = [
                ["Course", course.name],
                ["Instructor", course.instructor],
                ["Department", course.department],
                ["Days", session.days],
                ["Time", session.startTime + " - " + session.endTime],
                ["Location", session.location],
                ["Modality", course.modality],
                ["Credits", course.credits],
                ["Enrollment", `${current} / ${maximum}`]
            ];

            details.forEach(function(detail) {
                const paragraph = document.createElement("p");
                const label = document.createElement("strong");

                label.textContent = detail[0] + ": ";
                paragraph.appendChild(label);
                paragraph.appendChild(
                    document.createTextNode(
                        String(detail[1] ?? "Not specified")
                    )
                );

                card.appendChild(paragraph);
            });

            if (isEnrolled) {
                const status = document.createElement("p");
                status.className = "enrolled";
                status.textContent = "Status: Enrolled";
                card.appendChild(status);
            } else {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "register-button";
                button.textContent =
                    current >= maximum ? "Session Full" : "Register";

                button.disabled = current >= maximum;

                button.addEventListener("click", function() {
                    registerForCourse(sessionId);
                });

                card.appendChild(button);
            }

            return card;
        }

        // Display all enrolled and available sessions
        function displaySessions() {
            const enrolledContainer =
                document.getElementById("enrolled-sessions");

            const availableContainer =
                document.getElementById("available-sessions");

            enrolledContainer.innerHTML = "";
            availableContainer.innerHTML = "";

            testCourses.forEach(function(course) {
                if (!Array.isArray(course.sessions)) {
                    console.warn(
                        "Skipping course without sessions:",
                        course.code,
                        course.number,
                        course.name
                    );
                    return;
                }

                course.sessions.forEach(function(session) {
                    const sessionId = String(session.id);

                    const isEnrolled =
                        enrolledSessionIds.has(sessionId);

                    const card = createSessionCard(
                        course,
                        session,
                        isEnrolled
                    );

                    if (isEnrolled) {
                        enrolledContainer.appendChild(card);
                    } else {
                        availableContainer.appendChild(card);
                    }
                });
            });

            if (enrolledContainer.children.length === 0) {
                const emptyMessage = document.createElement("p");
                emptyMessage.className = "empty-message";
                emptyMessage.textContent =
                    "You are not enrolled in any sessions yet.";

                enrolledContainer.appendChild(emptyMessage);
            }

            if (availableContainer.children.length === 0) {
                const emptyMessage = document.createElement("p");
                emptyMessage.className = "empty-message";
                emptyMessage.textContent =
                    "No sessions are currently available to register for.";

                availableContainer.appendChild(emptyMessage);
            }
        }
        
        // Register the logged-in student for a specific session
        function registerForCourse(sessionId) {
            const message =
                document.getElementById("registration-message");

        // Require a valid login (set by student-login.html)
            const studentID = getLoggedInStudent();

            if (studentID === null) {
                message.textContent =
                    "Please log in with valid credentials before registering.";

                message.className = "message error";
                message.style.display = "block";
                return;
            }

            // Find the selected session
            const result = findSession(sessionId);

            if (!result) {
                message.textContent = "Session not found.";
                message.className = "message error";
                message.style.display = "block";
                return;
            }

            const course = result.course;
            const session = result.session;
            const key = String(session.id);

            // Prevent duplicate registration
            if (enrolledSessionIds.has(key)) {
                message.textContent =
                    "You are already registered for this session.";

                message.className = "message error";
                message.style.display = "block";
                return;
            }

            // Prevent registration when the session is full
            const maximum = Number(session.maximumEnrollment);

            if (sessionEnrollment[key] >= maximum) {
                message.textContent =
                    `${course.code}, Section ${session.section} is full.`;

                message.className = "message error";
                message.style.display = "block";

                displaySessions();
                return;
            }

            // Add the session to the student's enrolled sessions
            enrolledSessionIds.add(key);

            // Increase the displayed enrollment count
            sessionEnrollment[key]++;

            // Show confirmation
            message.textContent =
                `Successfully registered for ${course.code}, Section ${session.section}.`;

            message.className = "message success";
            message.style.display = "block";

            // Refresh the enrolled and available session lists
            displaySessions();
        }

            // Show which course was chosen, or explain if it has no sessions
            function showSelectedCourse() {
                const box = document.getElementById("selected-course");
    
                if (!selectedCode) {
            return;
            }
        
            const course = testCourses.find(function(item) {
                return item.code === selectedCode;
            });
        
            const hasSessions =
                course && Array.isArray(course.sessions) && course.sessions.length > 0;
        
            if (!course) {
                box.innerHTML =
                    '<div class="message error" style="display:block;"></div>';
                box.firstChild.textContent = "That course could not be found.";
            } else if (!hasSessions) {
                box.innerHTML =
                    '<div class="message error" style="display:block;"></div>';
                box.firstChild.textContent =
                    course.code + " - " + course.name +
                    " has no sessions open for registration right now.";
            } else {
                box.innerHTML = '<div class="selected-banner"></div>';
                box.firstChild.textContent =
                    "Selected course: " + course.code + " - " + course.name;
                }
            }
            
            // Initialize and display sessions when the page opens
           if (typeof testCourses !== "undefined" && Array.isArray(testCourses)) {
        // course-data.js keeps sessions in a separate list, so attach each
        // session to its course (skipped if the data is already nested)
        if (typeof sessions !== "undefined") {
            testCourses.forEach(function(course) {
                if (!Array.isArray(course.sessions)) {
                    course.sessions = sessions.filter(function(session) {
                        return session.courseCode === course.code;
                    });
                }
            });
        }
               
          document.getElementById("login-status").textContent =
            "Logged in as student " + getLoggedInStudent() + ".";     
        initializeSessions();
        displaySessions();
        showSelectedCourse();

        // Scroll to the chosen course's session card(s)
        const chosenCard = document.querySelector(".session-card.selected");
        if (chosenCard) {
            chosenCard.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    } else {
            document.getElementById("available-sessions").textContent =
                "Course data could not be loaded. Check that course-data.js is in the same folder.";
        }
    </script>

</body>
</html>
