<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Course Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Course Registration System</h1>
        
<nav>
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
    <a href="course-search.html">Course Search</a>
    <a href="course-details.html">Course Details</a>
    <a href="student-registration.html">Student Registration</a>
    <a href="instructor-schedule.html">Instructor Schedule</a>
    <a href="session-enrollment.html">Session Enrollment</a>
</nav>
    </header>

    <main>
        <h2>Student Login</h2>
        <p>Log in to access your student account and registration features.</p>

        <form class="login-box" onsubmit="return handleLogin(event)">
            <h3>Student Login</h3>

            <label for="student-id">Student ID</label>
            <input type="text" id="student-id" name="studentId" placeholder="Enter your student ID">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">

            <button type="submit">Log In</button>
        </form>

        <div id="login-message" class="message"></div>
    </main>

    <script src="course-data.js"></script>
    <script src="auth.js"></script>
    <script>
        function showLoginMessage(text, type) {
            const message = document.getElementById("login-message");
            message.textContent = text;
            message.className = "message " + type;
            message.style.display = "block";
        }

        function handleLogin(event) {
            event.preventDefault();

            const result = attemptLogin(
                document.getElementById("student-id").value.trim(),
                document.getElementById("password").value
            );

            if (!result.ok) {
                showLoginMessage(result.error, "error");
                return false;
            }

            showLoginMessage("Login successful. Redirecting...", "success");

            const next = new URLSearchParams(location.search).get("next");
            const safe = /^[\w-]+\.html(\?[^#]*)?$/.test(next || "");
            location.href = safe ? next : "course-search.html";
            return false;
        }
    </script>
</body>
</html>
