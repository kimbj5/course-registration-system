<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">

    <script src="auth.js"></script>
    <script>requireLogin();</script>
</head>

<body>

    <header>
        <h1>Course Registration System</h1>

        
<nav>
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
    <a href="course-search.html">Course Search</a>
    <a href="course-details.html">Course Details</a>
    <a href="student-registration.html">Student Registration</a>
    <a href="instructor-schedule.html">Instructor Schedule</a>
    <a href="session-enrollment.html">Session Enrollment</a>
</nav>
    </header>

    <main>

        <h2>Student Registration</h2>

        <p>
            Register for an available course session.
        </p>

        <!-- WHO IS LOGGED IN -->

        <p id="login-status"></p>
        
        <!-- COURSE CHOSEN ON THE SEARCH PAGE -->

        <div id="selected-course"></div>
        
        <!-- AVAILABLE SESSIONS -->

        <div class="registration-section">

            <h3>Available Sessions</h3>

            <div id="available-sessions"></div>

        </div>

        <!-- REGISTRATION MESSAGE -->

        <div id="registration-message" class="message"></div>

    </main>

    <script>
        // Everything on this page comes from the API, which reads the RDS database.
        // Links can pick a course or session to highlight:
        //   student-registration.html?course_id=3
        //   student-registration.html?session_id=3  (or ?session=3, from the details page)
        //   student-registration.html?course=INFO%20325  (a course code or a course_id)
        const params = new URLSearchParams(window.location.search);
        const selectedCourseId = params.get("course_id");
        const selectedSessionId = params.get("session_id") || params.get("session");
        const selectedCode = params.get("course");

        // Send a request to the API with the student's login token.
        // If the token is missing or expired, send the student back to log in.
        async function api(path, options) {
            const response = await fetch(path, Object.assign({}, options, {
                headers: { "Authorization": "Bearer " + getAuthToken() }
            }));

            const data = await response.json().catch(function() {
                return {};
            });

            if (response.status === 401) {
                logout();
                requireLogin();
                throw new Error("NOT_LOGGED_IN");
            }

            return { ok: response.ok, data: data };
        }

        function showMessage(text, type) {
            const message = document.getElementById("registration-message");
            message.textContent = text;
            message.className = "message " + type;
            message.style.display = "block";
        }

        function isSelected(session) {
            return String(session.session_id) === selectedSessionId ||
                String(session.course.course_id) === selectedCourseId ||
                String(session.course.course_id) === selectedCode ||
                session.course.number === selectedCode;
        }

        // Build a session card from a session returned by the API
        function createSessionCard(session) {
            const card = document.createElement("div");
            card.className = "session-card";

            if (isSelected(session)) {
                card.classList.add("selected");
            }

            const heading = document.createElement("h4");
            heading.textContent =
                session.course.number + " - Section " + session.section;
            card.appendChild(heading);

            const details = [
                ["Course", session.course.name],
                ["Instructor", session.instructor.first_name + " " + session.instructor.last_name],
                ["Department", session.course.department],
                ["Days", session.days],
                ["Time", session.time],
                ["Location", session.location],
                ["Credits", session.course.credits],
                ["Enrollment", session.enrolled_count + " / " + session.max_enrollment]
            ];

            details.forEach(function(detail) {
                const paragraph = document.createElement("p");
                const label = document.createElement("strong");

                label.textContent = detail[0] + ": ";
                paragraph.appendChild(label);
                paragraph.appendChild(
                    document.createTextNode(String(detail[1] ?? "Not specified"))
                );

                card.appendChild(paragraph);
            });

            const isFull = session.enrolled_count >= session.max_enrollment;
            const button = document.createElement("button");
            button.type = "button";
            button.className = "register-button";
            button.textContent = isFull ? "Session Full" : "Register";
            button.disabled = isFull;

            button.addEventListener("click", function() {
                registerForSession(session.session_id, button);
            });

            card.appendChild(button);

            return card;
        }

        function showList(container, cards, emptyText) {
            container.innerHTML = "";

            cards.forEach(function(card) {
                container.appendChild(card);
            });

            if (cards.length === 0) {
                const emptyMessage = document.createElement("p");
                emptyMessage.className = "empty-message";
                emptyMessage.textContent = emptyText;
                container.appendChild(emptyMessage);
            }
        }

        // Load all sessions with their seat counts and show them
        async function loadSessions() {
            const result = await api("/sessions/available");

            if (!result.ok) {
                showMessage("Sessions could not be loaded. Please refresh the page.", "error");
                return null;
            }

            showList(
                document.getElementById("available-sessions"),
                result.data.sessions.map(createSessionCard),
                "No sessions are currently available to register for."
            );

            return result.data.sessions;
        }

        // Register the logged-in student. The API checks seats and duplicates
        // and records the registration in the database.
        async function registerForSession(sessionId, button) {
            button.disabled = true;

            try {
                const result = await api(
                    "/sessions/" + encodeURIComponent(sessionId) + "/register",
                    { method: "POST" }
                );

                if (result.ok) {
                    showMessage(result.data.message, "success");
                } else {
                    showMessage(
                        result.data.error?.message || "Registration failed. Please try again.",
                        "error"
                    );
                }

                // Reload from the database so the counts are up to date
                await loadSessions();
            } catch (error) {
                if (error.message !== "NOT_LOGGED_IN") {
                    showMessage("Unable to connect to the server. Please try again.", "error");
                    button.disabled = false;
                }
            }
        }

        // Show which course was chosen, or explain if it has no sessions
        function showSelectedCourse(sessions) {
            const box = document.getElementById("selected-course");

            if (!selectedCourseId && !selectedSessionId && !selectedCode) {
                return;
            }

            const match = sessions.find(isSelected);

            if (match) {
                box.innerHTML = '<div class="selected-banner"></div>';
                box.firstChild.textContent =
                    "Selected course: " + match.course.number + " - " + match.course.name;
            } else {
                box.innerHTML = '<div class="message error" style="display:block;"></div>';
                box.firstChild.textContent =
                    "That course has no sessions open for registration right now.";
            }
        }

        async function startPage() {
            const student = getLoggedInStudentData();

            document.getElementById("login-status").textContent = student
                ? "Logged in as " + student.first_name + " " + student.last_name +
                  " (student " + student.student_id + ")."
                : "Logged in as student " + getLoggedInStudent() + ".";

            try {
                const sessions = await loadSessions();

                if (sessions) {
                    showSelectedCourse(sessions);

                    // Scroll to the chosen course's session card
                    const chosenCard = document.querySelector(".session-card.selected");
                    if (chosenCard) {
                        chosenCard.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                }
            } catch (error) {
                if (error.message !== "NOT_LOGGED_IN") {
                    showMessage("Unable to connect to the server. Please try again.", "error");
                }
            }
        }

        if (getAuthToken()) {
            startPage();
        } else {
            // Logged in before login tokens existed, so log in again
            logout();
            requireLogin();
        }
    </script>

</body>
</html>
